<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14213d" />
    <title>Spy Lab Academy Tycoon</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #14213d;
        touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      #loader { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: min(4vw, 4vh); background: radial-gradient(circle at 50% 40%, #1f5f6b, #14213d 70%);
        transition: opacity .25s; }
      #loader .logo { max-width: 92vw; text-align: center; font: 700 min(7.2vw, 9vh)/1.1 'Courier New', Courier, monospace; color: #fff3e0; letter-spacing: .06em;
        text-transform: uppercase; text-shadow: 0 .06em 0 #f2665c; }
      #loader .stamp { font: 700 min(3.6vw, 3vh)/1 'Courier New', Courier, monospace; color: #f2b134; letter-spacing: .3em;
        border: 3px solid #f2b134; padding: .4em .8em; transform: rotate(-4deg); }
      #loader .bar { width: min(64vw, 420px); height: 14px; border-radius: 99px; background: #0d1830; overflow: hidden;
        border: 2px solid #f3d9a4; }
      #loader .fill { width: 0; height: 100%; background: linear-gradient(90deg, #f2b134, #f2665c); transition: width .2s; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="ui"></div>
    </div>
    <div id="loader" aria-busy="true">
      <div class="logo">Spy Lab<br>Academy Tycoon</div>
      <div class="stamp" aria-hidden="true">&#9679;&nbsp;&#9679;&nbsp;&#9679;</div>
      <div class="bar"><div class="fill" id="loader-fill"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
